<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Dashboard</title>
<style>
  :root {
    --bg-color: #000000;
    --card-bg: #161616;
    --card-hover: #222222;
    --text-main: #ffffff;
    --text-muted: #888888;
    --accent-green: #00d632;
    --accent-blue: #00bfff;
    --accent-purple: #9370db;
    --accent-teal: #14b8a6;
  }
  * { box-sizing: border-box; }
  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 20px 16px 90px 16px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app-container { max-width: 480px; width: 100%; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .header h1 { font-size: 1.6rem; font-weight: 700; margin: 0; }
  .profile-avatar { width: 36px; height: 36px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: bold; }
  
  .balance-section { background-color: var(--card-bg); border-radius: 24px; padding: 24px; margin-bottom: 20px; }
  .balance-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .section-label { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
  .balance-amount { font-size: 2.3rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 16px; }
  
  .input-group { margin-bottom: 16px; }
  .input-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
  .input-group input { width: 100%; background: #000; border: 1px solid #333; border-radius: 12px; padding: 12px; color: #fff; font-size: 1rem; font-weight: 600; }

  .bento-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .bento-card { background-color: var(--card-bg); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; min-height: 120px; }
  .card-header { display: flex; justify-content: space-between; align-items: center; }
  .card-title { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
  .card-footer-val { font-size: 1.15rem; font-weight: 700; margin-top: 8px; }

  .section-card { background-color: var(--card-bg); border-radius: 24px; padding: 20px 24px; margin-bottom: 20px; }
  .section-card h3 { margin-top: 0; font-size: 1.05rem; margin-bottom: 16px; color: var(--text-main); }
  .bill-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; font-size: 0.9rem; }
  .bill-row:last-child { border-bottom: none; }
  .bill-label { color: var(--text-muted); }
  .bill-val { font-weight: 600; color: var(--text-main); }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background-color: #000000; border-top: 1px solid #161616; display: flex; justify-content: space-around; padding: 14px 0 26px 0; z-index: 100; }
  .nav-item { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
  .nav-item.active { color: var(--text-main); font-weight: bold; }
</style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <h1>Money</h1>
      <div class="profile-avatar">DM</div>
    </div>

    <!-- Live Income & Balance Tracker -->
    <div class="balance-section">
      <div class="balance-top-row">
        <span class="section-label">Estimated Monthly Surplus</span>
      </div>
      <div class="balance-amount" id="displaySurplus">$0.00</div>
      
      <div class="input-group">
        <label>Enter Weekly Commission / Paycheck</label>
        <input type="number" id="weeklyPay" value="1500" oninput="calculateBudget()">
      </div>
    </div>

    <!-- Bento Grid Summary -->
    <div class="bento-grid">
      <div class="bento-card">
        <div class="card-title">Monthly Income</div>
        <div class="card-footer-val" id="displayMonthlyIncome">$6,000.00</div>
      </div>
      <div class="bento-card">
        <div class="card-title">Fixed Bills Total</div>
        <div class="card-footer-val" id="displayFixedBills" style="color: #ff5252;">$3,260.00</div>
      </div>
    </div>

    <!-- Fixed Monthly Essentials -->
    <div class="section-card">
      <h3>Monthly Fixed Expenses</h3>
      <div class="bill-row"><span class="bill-label">Rent / Mortgage</span><span class="bill-val">$2,150.00</span></div>
      <div class="bill-row"><span class="bill-label">Utilities (Gas/Water/Power)</span><span class="bill-val">$50.00</span></div>
      <div class="bill-row"><span class="bill-label">Internet Bill</span><span class="bill-val">$75.00</span></div>
      <div class="bill-row"><span class="bill-label">Cellphone Bill</span><span class="bill-val">$65.00</span></div>
      <div class="bill-row"><span class="bill-label">Food & Groceries</span><span class="bill-val">$800.00</span></div>
      <div class="bill-row"><span class="bill-label">Transportation & Transit</span><span class="bill-val">$120.00</span></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active">$</button>
    <button class="nav-item">💳</button>
    <button class="nav-item">📊</button>
    <button class="nav-item">🔍</button>
    <button class="nav-item">🕒</button>
  </nav>

  <script>
    const fixedBillsTotal = 2150 + 50 + 75 + 65 + 800 + 120; // $3,260
    document.getElementById('displayFixedBills').innerText = '$' + fixedBillsTotal.toLocaleString('en-US', {minimumFractionDigits: 2});

    function calculateBudget() {
      let weekly = parseFloat(document.getElementById('weeklyPay').value) || 0;
      let monthlyIncome = weekly * 4;
      let surplus = monthlyIncome - fixedBillsTotal;

      document.getElementById('displayMonthlyIncome').innerText = '$' + monthlyIncome.toLocaleString('en-US', {minimumFractionDigits: 2});
      document.getElementById('displaySurplus').innerText = '$' + surplus.toLocaleString('en-US', {minimumFractionDigits: 2});
    }

    calculateBudget();
  </script>
</body>
</html>
